<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1250" viewBox="0 0 1120 1250" role="img" aria-labelledby="title description">
<title id="title">Four VLA integration patterns and two extensions</title>
<desc id="description">The original survey diagram, adapted from TikZ. Modular planning combines visual geometry and language constraints in value maps. Autoregression predicts successive action tokens with prefix reuse. Generative chunks refine noisy actions using task context and execute a prefix. Intermediate reasoning exposes language motions or subtasks to human correction before control. Extensions show reinforcement learning updates and a slow VLM paired with a fast visual controller using fresh observations.</desc>
